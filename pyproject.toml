[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-securecheck"
version = "0.1.0"
description = "A lightweight static security checker for ESP32 and Arduino firmware"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["esp32", "arduino", "iot", "security", "static-analysis", "firmware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
securecheck = "securecheck.cli:main"

[tool.setuptools.packages.find]
include = ["securecheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
