name: ESP32 SecureCheck
description: Scan ESP32, Arduino, and ESP-IDF source/configuration for common security issues and emit SARIF.
inputs:
  scan-path:
    description: Repository-relative directory or file to scan.
    required: false
    default: "."
  python-version:
    description: Python version used to run SecureCheck.
    required: false
    default: "3.12"
  fail-on:
    description: Fail when findings meet this severity (none, low, medium, high).
    required: false
    default: "none"
  upload-sarif:
    description: Upload SARIF to GitHub code scanning (requires security-events write permission).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ESP32 SecureCheck
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_SOURCE"

    - name: Scan firmware and generate SARIF
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.scan-path }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(scan "$SCAN_PATH" --format sarif --output "$GITHUB_WORKSPACE/securecheck.sarif")
        case "$FAIL_ON" in
          none|"") ;;
          low|medium|high) args+=(--fail-on "$FAIL_ON") ;;
          *) echo "Invalid fail-on value: $FAIL_ON (use none, low, medium, or high)" >&2; exit 2 ;;
        esac
        python -m securecheck "${args[@]}"

    - name: Upload SARIF report artifact
      if: ${{ always() && hashFiles('securecheck.sarif') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: securecheck-sarif
        path: securecheck.sarif
        if-no-files-found: warn
        retention-days: 30

    - name: Upload SARIF to GitHub code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles('securecheck.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: securecheck.sarif
        category: esp32-securecheck
